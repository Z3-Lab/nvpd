[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvpd-global"
version = "0.1.0"
description = "The primary global pagoda analysis using normal-vector probability distributions"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Zizhan Zhang", email = "zhangzizhan@tju.edu.cn"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
mesh = ["open3d==0.19.0"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[project.scripts]
nvpd-global = "nvpd_global.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "DATA_TERMS.md"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
nvpd_global = ["hebei43.csv", "datasets/hebei43_0_009H/*"]
